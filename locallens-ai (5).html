<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LocalLens AI – India audio guide</title>
<style>
:root{--hill:#0f3d3a;--hill2:#1d5c55;--gold:#e0a526;--kum:#b5232f;--mist:#eef3f1;--ink:#14201f;--mute:#5a6d6a;--card:#fff;--line:#d3dfdb;
--sans:system-ui,-apple-system,"Segoe UI","Noto Sans Telugu","Nirmala UI","Noto Sans Devanagari",sans-serif;--serif:Georgia,"Noto Serif Telugu","Nirmala UI",serif}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:8px}
body{font:16px/1.55 var(--sans);color:var(--ink);background:var(--mist);padding-bottom:84px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero{background:var(--hill);color:#fff;padding:env(safe-area-inset-top,0) 0 0;position:relative;overflow:hidden}
.hero .in{max-width:760px;margin:auto;padding:18px 18px 70px;position:relative;z-index:2}
.brand{font:700 1.5rem var(--serif);letter-spacing:.2px}
.brand small{display:block;font:400 .85rem var(--sans);opacity:.8;letter-spacing:0}
.langs{display:flex;gap:8px;margin-top:18px}
.langs button{flex:1;border:2px solid #ffffff55;background:transparent;color:#fff;border-radius:14px;padding:10px 6px;font-size:1.25rem;font-weight:600;transition:.2s}
.langs button[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#241a00}
.hills{position:absolute;left:0;right:0;bottom:-1px;height:70px;width:100%;z-index:1}
main{max-width:760px;margin:-8px auto 0;padding:0 14px}
.view{display:none;padding-top:14px}.view.on{display:block}
h2{font:700 1.6rem/1.2 var(--serif)}
h3{font:700 1.15rem var(--serif);margin-bottom:6px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.btn,.primary,.ghost{display:inline-flex;gap:6px;align-items:center;justify-content:center;border-radius:12px;padding:10px 16px;text-decoration:none;border:2px solid var(--hill);background:#fff;color:var(--hill);font-weight:600;min-height:44px}
.primary{background:var(--kum);border-color:var(--kum);color:#fff}
.primary[aria-pressed=true]{background:var(--ink);border-color:var(--ink)}
.ghost{border-color:var(--line);font-weight:500}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:thin}
.chips button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;white-space:nowrap}
.chips button[aria-current=true]{background:var(--hill);color:#fff;border-color:var(--hill)}
.place{background:var(--card);border-radius:20px;overflow:hidden;border:1px solid var(--line)}
.pic{height:190px;background:linear-gradient(135deg,var(--hill2),var(--gold));display:grid;place-items:center;font-size:3.5rem}
.pic img{width:100%;height:100%;object-fit:cover}
.body{padding:18px}
.meta{color:var(--mute);font-size:.9rem;margin-bottom:4px}
.desc{margin:10px 0 14px;max-width:62ch}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.story{margin-top:16px;padding:14px 16px;border-left:5px solid var(--gold);background:#fbf5e4;border-radius:0 12px 12px 0}
.next{margin-top:16px;width:100%}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card ol{padding-left:0;list-style:none;display:grid;gap:6px;margin:10px 0}
.card li button{width:100%;text-align:left;border:0;background:var(--mist);padding:10px 12px;border-radius:10px}
.card p{color:var(--mute)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.item b{display:block;font-family:var(--serif)}
.map{background:#dfeae6;border-radius:20px;border:1px solid var(--line);width:100%;height:auto;display:block}
.map text{font:600 11px var(--sans);fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:3px}
.map g.pin{cursor:pointer}
.chat{display:flex;flex-direction:column;gap:10px;min-height:260px;max-height:50vh;overflow:auto;padding:4px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.msg.me{align-self:flex-end;background:var(--hill);color:#fff;border-color:var(--hill)}
.ask{display:flex;gap:8px;margin-top:10px}
.ask input{flex:1;min-width:0}
input,select,textarea{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;width:100%;min-height:44px}
label{display:block;font-weight:600;margin:10px 0 4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0);z-index:9}
nav button{flex:1;max-width:150px;border:0;background:none;padding:10px 4px 8px;font-size:.78rem;color:var(--mute);display:grid;gap:2px;justify-items:center}
nav button span{font-size:1.35rem}
nav button[aria-current=true]{color:var(--kum);font-weight:700;box-shadow:inset 0 3px 0 var(--kum)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90%;text-align:center}
#toast.on{opacity:1}
.tag{display:inline-block;background:var(--mist);border-radius:8px;padding:2px 8px;font-size:.8rem;margin-right:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.search{display:flex;gap:8px;margin:14px 0 6px}.search input{flex:1;min-width:0}
.mic{flex:none;width:48px;min-height:44px;border-radius:12px;border:2px solid var(--hill);background:#fff;font-size:1.2rem}
.mic.rec{background:var(--kum);border-color:var(--kum);animation:p 1s infinite alternate}@keyframes p{to{opacity:.55}}
.res{display:grid;gap:6px;margin-bottom:6px}.res button{text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.vsel{display:flex;gap:8px;align-items:center;margin:4px 0 2px;color:var(--mute);font-size:.9rem}.vsel select{width:auto;min-height:36px;padding:4px 8px}
#lmap{height:430px;border-radius:20px;border:1px solid var(--line);z-index:0}
</style>

  <div class="in">
    <div class="brand">LocalLens AI<small id="tag">Your multilingual guide to India</small></div>
    <div class="langs" role="group" aria-label="Language">
      <button data-l="te" lang="te">తెలుగు</button><button data-l="en">English</button><button data-l="hi" lang="hi">हिन्दी</button>
    </div>
  </div>

</header>

  <div class="res" id="sres"></div>
  <div class="vsel"><label for="vl">🎤 Voice language</label><select id="vl"><option value="te">తెలుగు</option><option value="hi">हिन्दी</option><option value="en">English</option></select></div>
  <section class="view on" id="v-explore" aria-label="Explore"></section>
  <section class="view" id="v-map" aria-label="Map"></section>
  <section class="view" id="v-ask" aria-label="Ask">
    <h2>Ask LocalLens</h2><p class="meta">Type, or tap 🎤 and speak in Telugu, Hindi or English. The answer is spoken back in the same language.</p>
    <div class="chips" id="sugg"></div>
    <div class="chat" id="chat" aria-live="polite"></div>
    <form class="ask" id="askf"><input id="q" placeholder="Why is this place famous?" aria-label="Your question" autocomplete="off"><button type="button" class="mic" id="qmic" aria-label="Ask by voice">🎤</button><button class="primary">Ask</button></form>
  </section>
  <section class="view" id="v-trips" aria-label="Trips"></section>
  <section class="view" id="v-admin" aria-label="Admin"></section>
</main>

<nav aria-label="Main">
  <button data-v="explore"><span>🛕</span>Explore</button>

</nav>

function dist(a,b){const R=6371,r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dn=r(b[1]-a[1]);
 const h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}

/* ---------- Speech ---------- */
function stopSpeech(){speechSynthesis&&speechSynthesis.cancel();if(audio){audio.pause();audio=null}speaking=false}
function speak(text,l,custAudio){
 stopSpeech();
 if(custAudio){audio=new Audio(custAudio);audio.onended=()=>{speaking=false;renderExplore()};audio.play().catch(()=>toast('Could not play the uploaded audio'));speaking=true;return}
 if(!('speechSynthesis' in window)){toast('Audio is not supported in this browser');return}
 const u=new SpeechSynthesisUtterance(text);u.lang=VOICE[l];u.rate=.92;
 const v=speechSynthesis.getVoices().find(v=>v.lang.replace('_','-').toLowerCase().startsWith(l));
 if(v)u.voice=v;else toast('No '+LANGS_NAME[l]+' voice found on this device. Add one in your system language settings.');
 u.onend=u.onerror=()=>{speaking=false;renderExplore()};speechSynthesis.speak(u);speaking=true;
}

 </article>`;

function go(id){stopSpeech();cur=id;renderExplore();renderMap();ensureLang(get(id));ensureImg(get(id))}
function nextStop(){const l=route?route.stops:ordered().filter(catOk).map(x=>x.id);go(l[(l.indexOf(cur)+1)%l.length])}
document.addEventListener('click',e=>{
 const c=e.target.closest('button,a');if(!c)return;
 if(c.dataset.p){go(c.dataset.p)}
 else if(c.dataset.cat){cat=c.dataset.cat;const f=ordered().filter(catOk)[0];if(f)cur=f.id;renderExplore();ensureLang(get(cur));ensureImg(get(cur))}
 else if(c.id==='listen'){if(speaking){stopSpeech();renderExplore()}else{const p=get(cur),L=p.d[lang]?lang:'en';if(L!==lang)toast('No '+LANGS_NAME[lang]+' text for this place yet. Reading English.');speak(T(p.d),L,p.audio&&p.audio[lang]);renderExplore()}}
 else if(c.id==='next')nextStop();
 else if(c.id==='save'){savedIds.push(cur);ls.set('ll_saved',savedIds);try{localStorage.setItem('ll_offline_'+cur,JSON.stringify(get(cur)))}catch(x){}renderExplore();toast(U('saved'))}
 else if(c.id==='endr'){route=null;renderExplore()}
 else if(c.id==='demo'||c.id==='indiab'){const d=c.id==='demo';region=d?{name:'Tirupati (demo)',ll:[13.63,79.42],live:null}:{name:'India highlights',ll:[22.5,79],live:INDIA,india:1};pos=null;nb=null;route=null;cur=d?'venkateswara':'taj';cat='all';renderAll()}
 else if(c.id==='loc'){
  if(!navigator.geolocation){toast('Location is not available on this device');return}
  navigator.geolocation.getCurrentPosition(g=>{pos=[g.coords.latitude,g.coords.longitude];nb=null;loadRegion('Near you',pos)},()=>toast('Location permission denied. Pick a place from the list.'),{timeout:8000});
 }
 else if(c.dataset.go){setView('explore');go(c.dataset.go)}
 else if(c.dataset.route){route=routes().find(r=>r.id===c.dataset.route);cur=route.stops[0];setView('explore');renderExplore();window.scrollTo({top:0})}
 else if(c.dataset.del){custom=custom.filter(x=>x.id!==c.dataset.del);ls.set('ll_custom',custom);if(cur===c.dataset.del)cur='venkateswara';renderAll()}
});

/* ---------- Map: real map when online, drawn map when offline ---------- */
function renderMap(){
 if(!$('#v-map').classList.contains('on'))return;
 if(!window.L)return svgMap();
 $('#v-map').innerHTML='<h2>Map</h2><p class="meta">Tap a pin to open the place.</p><div id="lmap"></div>';
 const A=all(),m=L.map('lmap').setView(region.ll,13),pts=[];
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(m);
 A.forEach(p=>{pts.push(p.ll);L.circleMarker(p.ll,{radius:p.id===cur?11:8,color:'#fff',weight:3,fillColor:p.id===cur?'#b5232f':'#0f3d3a',fillOpacity:1}).addTo(m).bindTooltip(T(p.n).split(',')[0]).on('click',()=>{setView('explore');go(p.id)})});
 if(route)L.polyline(route.stops.map(get).map(p=>p.ll),{color:'#b5232f',dashArray:'7 5'}).addTo(m);
 if(pos)L.circleMarker(pos,{radius:7,color:'#fff',weight:3,fillColor:'#e0a526',fillOpacity:1}).addTo(m);
 if(pts.length>1)m.fitBounds(pts,{padding:[30,30]});
}
function svgMap(){
 const A=all(),la=A.map(p=>p.ll[0]),lo=A.map(p=>p.ll[1]);
 const a=Math.min(...la)-.015,b=Math.max(...la)+.015,c=Math.min(...lo)-.015,d=Math.max(...lo)+.015;
 const X=p=>40+(p.ll[1]-c)/(d-c)*520,Y=p=>30+(b-p.ll[0])/(b-a)*340;
 const line=route?`<polyline points="${route.stops.map(get).map(p=>X(p)+','+Y(p)).join(' ')}" fill="none" stroke="#b5232f" stroke-width="3" stroke-dasharray="7 5"/>`:'';
 $('#v-map').innerHTML=`<h2>Map</h2><p class="meta">Tap a pin to open the place.${route?' Dashed line is your route.':''}</p>
 <svg class="map" viewBox="0 0 600 400" role="img" aria-label="Map of tourist places">
  <path d="M0 70 90 30 170 60 270 10 380 55 480 20 600 60V0H0z" fill="#9fc1b7"/>
  <path d="M0 400V330Q150 290 260 340T600 300V400z" fill="#cfe0d9"/>${line}
  ${A.map(p=>`<g class="pin" tabindex="0" role="button" aria-label="${esc(T(p.n))}" data-g="${esc(p.id)}"><circle cx="${X(p)}" cy="${Y(p)}" r="${p.id===cur?13:9}" fill="${p.id===cur?'#b5232f':'#0f3d3a'}" stroke="#fff" stroke-width="3"/><text x="${X(p)+14}" y="${Y(p)+4}">${esc(T(p.n).split(',')[0])}</text></g>`).join('')}
  ${pos&&pos[0]>a&&pos[0]<b&&pos[1]>c&&pos[1]<d?`<circle cx="${40+(pos[1]-c)/(d-c)*520}" cy="${30+(b-pos[0])/(b-a)*340}" r="7" fill="#e0a526" stroke="#fff" stroke-width="3"/>`:''}
 </svg>`;
 $$('#v-map .pin').forEach(g=>{const f=()=>{setView('explore');go(g.dataset.g)};g.onclick=f;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}}});
}

/* ---------- Live places: any town in India ---------- */
const WP=(l,q)=>fetch(`https://${l}.wikipedia.org/w/api.php?format=json&origin=*&${q}`).then(r=>r.json());
async function findPlace(q){
 const r=await fetch('https://photon.komoot.io/api/?limit=8&bbox=68.1,6.5,97.5,37.1&q='+encodeURIComponent(q)).then(r=>r.json());
 return r.features.filter(x=>x.properties.countrycode==='IN').slice(0,5).map(x=>{const p=x.properties;return{name:[p.name,p.district||p.city,p.state].filter(Boolean).join(', '),ll:[x.geometry.coordinates[1],x.geometry.coordinates[0]]}});
}
async function loadRegion(name,ll){
 toast('Finding places near '+name.split(',')[0]+'…');
 try{
  const g=await WP('en',`action=query&list=geosearch&gscoord=${ll[0]}|${ll[1]}&gsradius=10000&gslimit=20`);
  const hits=(g.query&&g.query.geosearch)||[];
  if(!hits.length){toast('No guide entries here yet. Try a nearby bigger town.');return}
  const ex=await WP('en',`action=query&prop=extracts|pageimages&exintro=1&explaintext=1&exsentences=4&exlimit=20&piprop=thumbnail&pithumbsize=600&pageids=${hits.map(h=>h.pageid).join('|')}`);
  const pg=(ex.query&&ex.query.pages)||{};
  region={name,ll,live:hits.map(h=>{const q=pg[h.pageid]||{};return{id:'w'+h.pageid,type:'other',live:1,title:h.title,ll:[h.lat,h.lon],dm:h.dist,n:{en:h.title},d:{en:q.extract||'No description available yet.'},img:q.thumbnail&&q.thumbnail.source}})};
  cur=region.live[0].id;route=null;nb=null;cat='all';stopSpeech();renderAll();setView('explore');
 }catch(e){toast('Could not load places. Check your internet connection.')}
}
async function ensureLang(p){
 if(!p||!p.live||lang==='en'||p.d[lang]||p['x'+lang])return;
 p['x'+lang]=1;
 try{
  const a=await WP('en',`action=query&prop=langlinks&lllang=${lang}&redirects=1&titles=${encodeURIComponent(p.title)}`);
  const ll=Object.values(a.query.pages)[0].langlinks;
  if(!ll||!ll[0]){toast(LANGS_NAME[lang]+' article not found for this place. Showing English.');return}
  const t=ll[0]['*'],b=await WP(lang,`action=query&prop=extracts&exintro=1&explaintext=1&exsentences=4&titles=${encodeURIComponent(t)}`),x=Object.values(b.query.pages)[0];
  p.n[lang]=t;if(x.extract)p.d[lang]=x.extract;
  if(cur===p.id)renderExplore();
 }catch(e){}
}
async function ensureImg(p){
 if(!p||!p.live||!p.title||p.img||p.xi)return;p.xi=1;
 try{const a=await WP('en',`action=query&prop=pageimages&piprop=thumbnail&pithumbsize=700&redirects=1&titles=${encodeURIComponent(p.title)}`);
  const q=Object.values(a.query.pages)[0];if(q.thumbnail){p.img=q.thumbnail.source;if(cur===p.id)renderExplore()}}catch(e){}
}
async function names(){
 if(lang==='en'||!region.live)return;
 const L=lang,list=region.live.filter(p=>p.title&&!p.n[L]).slice(0,50);if(!list.length)return;
 try{const a=await WP('en',`action=query&prop=langlinks&lllang=${L}&lllimit=50&redirects=1&titles=${list.map(p=>encodeURIComponent(p.title)).join('|')}`);
  const m={};Object.values(a.query.pages).forEach(q=>{if(q.langlinks&&q.langlinks[0])m[q.title]=q.langlinks[0]['*']});
  ((a.query&&a.query.redirects)||[]).forEach(r=>{if(m[r.to])m[r.from]=m[r.to]});
  list.forEach(p=>{if(m[p.title])p.n[L]=m[p.title]});if(L===lang){renderExplore();renderTrips()}}catch(e){}
}
let found=[];
$('#sf').onsubmit=async e=>{e.preventDefault();const q=$('#sq').value.trim();if(!q)return;
 try{found=await findPlace(q);
  if(!found.length){$('#sres').innerHTML='';toast('No place found in India. Check the spelling.');return}
  if(found.length===1){pick(found[0]);return}
  $('#sres').innerHTML=found.map((x,i)=>`<button data-r="${i}">📍 ${esc(x.name)}</button>`).join('');
 }catch(x){toast('Searching needs an internet connection.')}};
$('#sres').onclick=e=>{const b=e.target.closest('button');if(b){const x=found[b.dataset.r];$('#sres').innerHTML='';pick(x)}};
function pick(x){pos=null;nb=null;$('#sres').innerHTML='';loadRegion(x.name,x.ll)}

/* ---------- Voice input: Telugu, Hindi, English ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function voice(btn,done){
 if(!SR){toast('Voice input works in Chrome, Edge or Safari. Please try one of them.');return}
 const r=new SR();r.lang=VOICE[$('#vl').value];r.interimResults=false;r.maxAlternatives=1;btn.classList.add('rec');
 r.onresult=e=>done(e.results[0][0].transcript);
 r.onerror=e=>toast(e.error==='not-allowed'?'Allow microphone access to use voice.':'I could not hear you. Tap the mic and try again.');
 r.onend=()=>btn.classList.remove('rec');
 try{r.start()}catch(x){btn.classList.remove('rec')}
}
$('#qmic').onclick=()=>voice($('#qmic'),t=>{$('#q').value=t;ask(t,1);$('#q').value=''});
$('#smic').onclick=()=>voice($('#smic'),t=>{$('#sq').value=t;$('#sf').requestSubmit()});

/* ---------- Ask (answers in the language you used) ---------- */
const K={food:/food|eat|laddu|prasad|hungry|tiffin|restaurant|భోజన|తిండి|ఆహార|లడ్డు|తినడ|తినాల|खाना|भोजन|खाने|लड्डू|भूख/i,
 shop:/shop|buy|souvenir|craft|gift|market|షాప|కొన|మార్కెట్|దుకాణ|खरीद|दुकान|शॉपिंग|बाज़ार|बाजार|सामान/i,
 route:/route|trip|plan|itinerary|మార్గ|ప్రయాణ|యాత్ర|ప్లాన్|रास्ता|मार्ग|यात्रा|योजना|प्लान/i,
 near:/near|close|around|దగ్గర|సమీప|చుట్టు|पास|नज़दीक|नजदीक|निकट|आसपास/i,
 time:/open|timing|hour|ticket|fee|dress|సమయ|టికెట్|ఫీజు|समय|टिकट|शुल्क|खुल/i};
const A={food:{en:'You can find food places near here in the Trips tab. ',te:'ఈ ప్రాంతంలోని భోజన స్థలాలు ట్రిప్స్ ట్యాబ్‌లో ఉన్నాయి. ',hi:'यहाँ के खाने की जगहें ट्रिप्स टैब में हैं। '},
 shop:{en:'Nearby shops and handicraft stores are in the Trips tab. ',te:'సమీపంలోని షాపులు, హస్తకళల దుకాణాలు ట్రిప్స్ ట్యాబ్‌లో ఉన్నాయి. ',hi:'पास की दुकानें और हस्तशिल्प स्टोर ट्रिप्स टैब में हैं। '},
 route:{en:'A ready route for this area is in the Trips tab. Tap Start this route.',te:'ఈ ప్రాంతానికి సిద్ధమైన మార్గం ట్రిప్స్ ట్యాబ్‌లో ఉంది. ఈ మార్గం ప్రారంభించండి నొక్కండి.',hi:'इस इलाके का तैयार रास्ता ट्रिप्स टैब में है। यह रास्ता शुरू करें दबाएँ।'},
 near:{en:'Places near here: ',te:'ఇక్కడ సమీపంలోని ప్రదేశాలు: ',hi:'यहाँ के पास की जगहें: '},
 time:{en:'Timings, tickets and dress codes change. Please check the official notice board or website before you go.',te:'సమయాలు, టికెట్లు, వస్త్రధారణ నియమాలు మారవచ్చు. వెళ్లే ముందు అధికారిక నోటీసు లేదా వెబ్‌సైట్ చూడండి.',hi:'समय, टिकट और ड्रेस कोड बदल सकते हैं। जाने से पहले आधिकारिक सूचना या वेबसाइट देखें।'},
 story:{en:'Local story: ',te:'స్థానిక కథ: ',hi:'स्थानीय कथा: '}};
const SW=new Set(['temple','swamy','local','the','శ్రీ','ఆలయం','श्री','मंदिर']);
function answer(q){
 const s=q.toLowerCase(),l=/[\u0C00-\u0C7F]/.test(q)?'te':/[\u0900-\u097F]/.test(q)?'hi':'en',Tl=o=>o[l]||o.en;
 for(const k of ['food','shop','route','near','time'])if(K[k].test(s)){
  let t=A[k][l];if(k==='near')t+=ordered().slice(0,3).map(x=>Tl(x.n).split(',')[0]).join(', ')+'.';
  return{t,l}}
 const hit=all().find(x=>Object.values(x.n).some(n=>n.toLowerCase().split(/[ ,]+/).some(w=>w.length>3&&!SW.has(w)&&s.includes(w)))),t=hit||get(cur);
 return{t:Tl(t.d)+(t.s?' '+A.story[l]+t.s:''),l:t.d[l]?l:'en'};
}
function say(t,me,l){const d=document.createElement('div');d.className='msg'+(me?' me':'');d.textContent=t;
 if(!me){const b=document.createElement('button');b.className='ghost';b.style.marginTop='8px';b.textContent='🎧 '+U('listen');b.onclick=()=>speak(t,l||lang);d.append(document.createElement('br'),b)}
 $('#chat').append(d);d.scrollIntoView({block:'nearest'})}
function ask(q,v){say(q,1);const r=answer(q);say(r.t,0,r.l);if(v)speak(r.t,r.l)}
$('#askf').onsubmit=e=>{e.preventDefault();const q=$('#q').value.trim();if(!q)return;ask(q);$('#q').value=''};
const SUG={en:['Why is this place famous?','What food should I try?','What can I buy?','Plan my trip'],te:['ఈ ప్రదేశం ఎందుకు ప్రసిద్ధి?','ఏ ఆహారం తినాలి?','ఏమి కొనాలి?','నా ప్రయాణం ప్లాన్ చేయండి'],hi:['यह जगह क्यों प्रसिद्ध है?','क्या खाना चाहिए?','क्या खरीदें?','मेरी यात्रा की योजना बनाएँ']};
function renderSugg(){$('#sugg').innerHTML=SUG[lang].map(x=>`<button>${x}</button>`).join('');
 $$('#sugg button').forEach(b=>b.onclick=()=>ask(b.textContent))}

/* ---------- Trips, food, shopping ---------- */
function routes(){
 if(!region.live)return ROUTES;if(region.india)return ROUTES_IN;
 const left=region.live.slice(0,6),o=[left.shift()];
 while(left.length){const l=o[o.length-1];left.sort((x,y)=>dist(l.ll,x.ll)-dist(l.ll,y.ll));o.push(left.shift())}
 return[{id:'auto',n:'Nearby highlights',stops:o.map(x=>x.id)}];
}
async function loadNearby(){
 nb='loading';renderTrips();const [la,lo]=region.ll;
 const q=`[out:json][timeout:20];(nwr["amenity"~"restaurant|cafe|fast_food|food_court"]["name"](around:2500,${la},${lo});nwr["shop"~"gift|handicraft|souvenir|clothes|jewelry"]["name"](around:2500,${la},${lo}););out center 40;`;
 try{const j=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:'data='+encodeURIComponent(q)}).then(r=>r.json());
  nb=j.elements.map(e=>({t:e.tags,k:e.tags.amenity?'food':'shop',ll:[e.lat??(e.center&&e.center.lat),e.lon??(e.center&&e.center.lon)]})).filter(x=>x.ll[0]);
 }catch(e){nb='err'}
 renderTrips();
}
function renderTrips(){
 const li=a=>a.map(x=>`<div class="item"><b>${esc(lang==='te'?x[1]:x[0])}</b>${lang==='te'?esc(x[0])+' · ':''}<p>${esc(x[2])}</p></div>`).join('');
 const near=k=>region.india?'<p class="meta">Search a city or tap “Use my location” to see food and shops nearby.</p>':nb==='loading'?'<p class="meta">Loading nearby places…</p>':nb==='err'?'<p class="meta">Could not load nearby places. Check your internet connection.</p>':
  (Array.isArray(nb)&&nb.filter(x=>x.k===k).length?'<div class="grid" style="margin-top:10px">'+nb.filter(x=>x.k===k).slice(0,8).map(x=>`<div class="item"><b>${esc(x.t['name:'+lang]||x.t.name)}</b><a class="btn" style="margin-top:8px" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${x.ll[0]},${x.ll[1]}">🗺️ ${U('nav')}</a></div>`).join('')+'</div>':'<p class="meta">Nothing found within 2.5 km.</p>');
 $('#v-trips').innerHTML=`<h2>Tourist routes</h2><p class="meta">Pick a route and the guide moves stop by stop.</p>
 ${routes().map(r=>`<div class="card"><h3>${esc(r.n)}</h3><ol>${r.stops.map(id=>`<li><button data-go="${id}">${ICON[get(id).type]||'📍'} ${esc(T(get(id).n))}</button></li>`).join('')}</ol><button class="primary" data-route="${r.id}">Start this route</button></div>`).join('')}
 <h2 style="margin-top:22px">🍛 Local food</h2>${region.live?near('food'):'<div class="grid" style="margin-top:10px">'+li(FOOD)+'</div>'}
 <h2 style="margin-top:22px">🛍️ Local shopping</h2><div style="margin-bottom:20px">${region.live?near('shop'):'<div class="grid" style="margin-top:10px">'+li(SHOP)+'</div>'}</div>`;
}

/* ---------- Admin ---------- */
function renderAdmin(){
 $('#v-admin').innerHTML=`<h2>Admin panel</h2><p class="meta">Add a tourist place. It is saved on this device only.</p>
 <form class="card" id="af">
  <label for="an">Place name</label><input id="an" required>
  <div class="row"><div><label for="at">Category</label><select id="at"><option value="temple">Temple</option><option value="museum">Museum</option><option value="market">Market</option><option value="food">Food</option><option value="other">Other</option></select></div>
  <div><label for="al">Language of description</label><select id="al"><option value="en">English</option><option value="te">Telugu</option><option value="hi">Hindi</option></select></div></div>
  <div class="row"><div><label for="ala">Latitude</label><input id="ala" type="number" step="any" min="-90" max="90" required placeholder="13.6288"></div><div><label for="alo">Longitude</label><input id="alo" type="number" step="any" min="-180" max="180" required placeholder="79.4192"></div></div>
  <label for="ad">Description</label><textarea id="ad" rows="4" required></textarea>
  <label for="as">Local story (optional)</label><textarea id="as" rows="2"></textarea>
  <div class="row"><div><label for="ai">Image</label><input id="ai" type="file" accept="image/*"></div><div><label for="au">Audio guide</label><input id="au" type="file" accept="audio/*"></div></div>
  <p class="meta" style="margin-top:6px">If you upload audio, it plays for the language you chose above. Otherwise the app reads the description aloud.</p>
  <button class="primary" style="margin-top:12px;width:100%">Add place</button>
 </form>
 <h3>Places you added</h3>${custom.length?custom.map(p=>`<div class="card"><b>${esc(T(p.n))}</b> <span class="tag">${esc(p.type)}</span><div class="bar" style="margin:8px 0 0"><button class="ghost" data-go="${esc(p.id)}">Open</button><button class="ghost" data-del="${esc(p.id)}">Delete</button></div></div>`).join(''):'<p class="meta">No places yet. Your first one will appear here.</p>'}`;
 $('#af').onsubmit=async e=>{e.preventDefault();
  const rd=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
  const L=$('#al').value,txt=$('#ad').value.trim(),nm=$('#an').value.trim(),im=$('#ai').files[0],au=$('#au').files[0];
  if(im&&im.size>900e3)return toast('Image is over 900 KB. Choose a smaller one.');
  if(au&&au.size>1.5e6)return toast('Audio is over 1.5 MB. Choose a shorter clip.');
  const p={id:'c'+Date.now(),type:$('#at').value,ll:[+$('#ala').value,+$('#alo').value],n:{en:nm,te:nm,hi:nm},d:{en:txt,[L]:txt},s:$('#as').value.trim()};
  if(im)p.img=await rd(im);if(au)p.audio={[L]:await rd(au)};
  custom.push(p);if(!ls.set('ll_custom',custom)){custom.pop();return}
  toast(inR(p)?'Place added':'Place added. It shows when you browse within 80 km of it.');renderAll();
 };
}

/* ---------- Shell ---------- */
function setView(v){stopSpeech();$$('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
 $$('nav button').forEach(b=>b.toggleAttribute('aria-current',b.dataset.v===v)||b.removeAttribute('aria-current'));
 $$('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===v));window.scrollTo({top:0});if(v==='map')renderMap();if(v==='trips'){if(region.live&&!region.india&&nb===null)loadNearby();else renderTrips()}}
$$('nav button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
$$('.langs button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;ls.set('ll_lang',lang);stopSpeech();renderAll()});
function renderAll(){
 document.documentElement.lang=lang;$('#tag').textContent=U('tag');
 $$('.langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
 renderExplore();renderMap();renderTrips();renderAdmin();renderSugg();ensureLang(get(cur));ensureImg(get(cur));names();$('#vl').value=lang;$('#sq').placeholder=U('sph');$('#q').placeholder=U('qph');
}
if('speechSynthesis' in window)speechSynthesis.getVoices();
renderAll();setView('explore');
say('Hi! Ask me about a place, local food, shopping or a route.');
</script>
